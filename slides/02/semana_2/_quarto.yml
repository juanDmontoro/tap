project:
  type: default
  render:
    - 02_codigo_esencial.qmd

# Opciones que los perfiles sobreescriben (dimensiones, tema). NO pueden estar en
# el YAML del .qmd: el documento tiene prioridad sobre el proyecto.
format:
  clean-revealjs:
    theme:
      - default
      - _extensions/grantmcdermott/clean/clean.scss
      - ../../../_tap_theme/tap.scss
      - ../../../_tap_theme/tap-aula.scss
      - aula.scss
    width: 1920
    height: 1080
    include-in-header:
      text: |
        <script>
        // Deck de código: el alumno pulsa Run en cada celda (sin plegado ni ejecución automática).
        // Solo se mantiene el indicador de estado (span.pyodide-estado) y los errores de carga visibles.
        (function () {
          const estado = (txt) => document.querySelectorAll(".pyodide-estado").forEach(e => e.textContent = txt);
          let fallo = false;
          window.addEventListener("error", (e) => {
            if (/pyodide|monaco|jsdelivr/i.test((e.message || "") + (e.filename || ""))) { fallo = true; estado("Python: error de carga (" + (e.message || e.filename) + ")"); }
          });
          window.addEventListener("unhandledrejection", (e) => {
            const msg = String(e.reason && e.reason.message || e.reason);
            if (!/pyodide|python|monaco|jsdelivr|micropip|wasm/i.test(msg)) return;
            fallo = true; estado("Python: error (" + msg.slice(0, 120) + ")");
          });
          // Estimadores y pipelines como diagrama, igual que en Jupyter. La extensión muestra el
          // valor final de la celda y lo impreso como HTML: str(estimador) pasa a devolver el HTML
          // de scikit-learn. El código de las celdas no cambia.
          let diagramas = "pendiente";
          const activarDiagramas = async function () {
            diagramas = "cargando";
            try {
              await globalThis.mainPyodide.loadPackage("scikit-learn");
              await globalThis.mainPyodide.runPythonAsync([
                "from sklearn.base import BaseEstimator",
                "from sklearn.utils import estimator_html_repr",
                "_en_curso = []",
                "def _diagrama(self):",
                "    # estimator_html_repr llama a str(): dentro de esa llamada, texto normal",
                "    if _en_curso:",
                "        return repr(self)",
                "    _en_curso.append(1)",
                "    try:",
                "        return estimator_html_repr(self).replace('\\n', ' ')",
                "    except Exception:",
                "        return repr(self)",
                "    finally:",
                "        _en_curso.pop()",
                "BaseEstimator.__str__ = _diagrama",
                "# PNG en la salida de la celda: evita el backend canvas interactivo",
                "import matplotlib.pyplot as plt",
                "plt.switch_backend('agg')",
                "import io, base64",
                "from js import document",
                "def _mostrar_figuras(*args, **kwargs):",
                "    for numero in plt.get_fignums():",
                "        figura = plt.figure(numero)",
                "        buffer = io.BytesIO()",
                "        figura.savefig(buffer, format='png', bbox_inches='tight')",
                "        imagen = document.createElement('img')",
                "        imagen.src = 'data:image/png;base64,' + base64.b64encode(buffer.getvalue()).decode('ascii')",
                "        imagen.alt = 'Gráfico de matplotlib'",
                "        document.pyodideMplTarget.appendChild(imagen)",
                "        plt.close(figura)",
                "plt.show = _mostrar_figuras"
              ].join("\n"));
            } catch (e) { console.warn("Diagramas de scikit-learn no disponibles:", e); }
            diagramas = "listo";
          };
          setInterval(function () {
            if (globalThis.mainPyodide && diagramas === "pendiente") activarDiagramas();
            if (fallo) return;
            const btn = document.querySelector(".qpyodide-button-run");
            estado(!btn ? "Python: preparando las celdas…" :
                   btn.disabled ? "Python: cargando el intérprete (10-40 s)…" :
                   diagramas !== "listo" ? "Python: cargando scikit-learn…" : "Python: listo");
          }, 500);
        })();
        </script>
