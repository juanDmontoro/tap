<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de gradient boosting</title>
<!--
  Simulador del deck de boosting (tema 4, semana 2). Adaptado el 22-10-2026 de gbm_interactivo.html
  (simuladores_gbm_xgboost_mejorados_quarto.zip, original en ../legacy/) al aspecto del deck: fondo claro,
  colores del curso, letra legible en el aula, vocabulario del curso. El modelo no cambia: árboles de
  regresión ajustados a los residuos, sin penalización. Parámetros iniciales por URL: ?arboles=12&tasa=0.3&prof=2
  23-10-2026 (auditoría): el título del panel de predicción dice «observaciones simuladas».
-->
<style>
:root {
  --azul: #447099; --azul-oscuro: #1F3A5F; --naranja: #E07A5F; --salvia: #81B29A; --gris: #6C757D;
  --fondo: #FFFFFF; --panel: #F4F7FA; --borde: #D5DEE8; --rejilla: #DCE3EA;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); color: var(--azul-oscuro);
  font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding: 6px 4px; font-size: 24px; }
.graficos { display: grid; grid-template-columns: 1.45fr 1fr; gap: 20px; }
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.titulo-panel { font-weight: 600; font-size: 24px; margin: 0 0 4px; }
svg { width: 100%; height: auto; display: block; }
.leyenda { display: flex; gap: 26px; flex-wrap: wrap; font-size: 22px; margin-top: 4px; }
.leyenda span { display: inline-flex; align-items: center; gap: 8px; }
.marca { display: inline-block; width: 28px; height: 5px; border-radius: 3px; }
.marca.punto { width: 14px; height: 14px; border-radius: 50%; }
.marca.hueco { background: transparent !important; border: 3px solid var(--azul); }
.mandos { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 34px; margin-top: 16px; align-items: start; }
.mando label, .mando .etiqueta { display: flex; justify-content: space-between; align-items: baseline;
  font-weight: 600; font-size: 24px; margin-bottom: 10px; }
.mando output { font-size: 30px; font-weight: 700; color: var(--naranja); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; height: 30px; accent-color: var(--azul); cursor: pointer; }
.botones { display: flex; gap: 8px; }
.botones button { flex: 1; font: inherit; font-size: 24px; font-weight: 600; padding: 8px 4px; border-radius: 8px;
  border: 2px solid var(--borde); background: var(--fondo); color: var(--azul-oscuro); cursor: pointer; }
.botones button[aria-pressed=true] { background: var(--azul); border-color: var(--azul); color: #FFFFFF; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
.cifras { display: flex; gap: 46px; margin-top: 14px; font-size: 24px; }
.cifras strong { font-size: 30px; font-variant-numeric: tabular-nums; margin-left: 8px; }
</style>
</head>
<body>
<section class="graficos" aria-label="Gráficos del modelo">
  <div class="panel">
    <p class="titulo-panel">Predicción tras B árboles (observaciones simuladas)</p>
    <svg id="grafAjuste" viewBox="0 0 640 300" role="img" aria-label="Observaciones simuladas de entrenamiento y validación y predicción del boosting"></svg>
    <div class="leyenda">
      <span><i class="marca punto" style="background:var(--gris)"></i>entrenamiento</span>
      <span><i class="marca punto hueco"></i>validación</span>
      <span><i class="marca" style="background:var(--naranja)"></i>predicción</span>
    </div>
  </div>
  <div class="panel">
    <p class="titulo-panel">RMSE según el número de árboles</p>
    <svg id="grafError" viewBox="0 0 440 300" role="img" aria-label="RMSE de entrenamiento y de validación según el número de árboles"></svg>
    <div class="leyenda">
      <span><i class="marca" style="background:var(--gris)"></i>entrenamiento</span>
      <span><i class="marca" style="background:var(--azul)"></i>validación</span>
    </div>
  </div>
</section>
<section class="mandos" aria-label="Hiperparámetros">
  <div class="mando">
    <label for="arboles">Número de árboles B <output id="valorArboles">12</output></label>
    <input type="range" id="arboles" min="0" max="60" step="1" value="12">
  </div>
  <div class="mando">
    <div class="etiqueta">Tasa de aprendizaje ν</div>
    <div class="botones" id="botonesTasa" role="group" aria-label="Tasa de aprendizaje">
      <button type="button" data-valor="0.05">0,05</button><button type="button" data-valor="0.1">0,1</button><button type="button" data-valor="0.3" aria-pressed="true">0,3</button><button type="button" data-valor="0.7">0,7</button>
    </div>
  </div>
  <div class="mando">
    <div class="etiqueta">Profundidad de cada árbol</div>
    <div class="botones" id="botonesProf" role="group" aria-label="Profundidad de cada árbol">
      <button type="button" data-valor="1">1</button><button type="button" data-valor="2" aria-pressed="true">2</button><button type="button" data-valor="3">3</button><button type="button" data-valor="4">4</button>
    </div>
  </div>
</section>
<div class="cifras" aria-live="polite">
  <span>RMSE de entrenamiento<strong id="rmseEnt" style="color:var(--gris)">—</strong></span>
  <span>RMSE de validación<strong id="rmseVal" style="color:var(--azul)">—</strong></span>
  <span>Menor RMSE de validación con<strong id="mejorB">—</strong></span>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const MAX_ARBOLES = 60;
  const COLOR = { azul: '#447099', azulOscuro: '#1F3A5F', naranja: '#E07A5F', gris: '#6C757D', rejilla: '#DCE3EA', fondo: '#FFFFFF' };
  const ajustes = { arboles: 12, tasa: 0.3, prof: 2 };
  const params = new URLSearchParams(location.search);
  if (params.has('arboles')) ajustes.arboles = Math.min(MAX_ARBOLES, Math.max(0, +params.get('arboles')));
  if (params.has('tasa')) ajustes.tasa = +params.get('tasa');
  if (params.has('prof')) ajustes.prof = +params.get('prof');

  // Observaciones simuladas fijas: 36 de entrenamiento y 25 de validación (semilla fija)
  function generador(semilla) { let v = semilla >>> 0; return () => { v = (1664525 * v + 1013904223) >>> 0; return v / 4294967296; }; }
  const azar = generador(20261022);
  const ruido = () => (azar() + azar() + azar() + azar() - 2) * 1.3;
  const verdad = x => 4.4 + 1.55 * Math.sin(x * 8.4) - 0.8 * Math.cos(x * 17) + 2.4 * x + 1.25 * Math.exp(-Math.pow((x - 0.7) / 0.095, 2));
  const entreno = Array.from({ length: 36 }, (_, i) => { const x = (i + 0.5) / 36; return { x, y: verdad(x) + ruido() }; });
  const valida = Array.from({ length: 25 }, (_, i) => { const x = (i + 0.35) / 25; return { x, y: verdad(x) + ruido() }; });
  const rejilla = Array.from({ length: 270 }, (_, i) => i / 269);
  const media = a => a.reduce((s, v) => s + v, 0) / a.length;
  const rmse = (filas, pred) => Math.sqrt(media(filas.map((f, i) => (f.y - pred[i]) ** 2)));

  // Árbol de regresión: en cada nodo, el corte que más reduce la suma de cuadrados de los residuos
  function arbol(filas, profMax) {
    function nodo(datos, prof) {
      const m = media(datos.map(d => d.r));
      let mejor = null;
      if (prof < profMax && datos.length >= 2) {
        const orden = [...datos].sort((a, b) => a.x - b.x);
        let suma = 0, sumaCuad = 0;
        for (const d of orden) { suma += d.r; sumaCuad += d.r * d.r; }
        let sumaIzq = 0, cuadIzq = 0;
        for (let i = 0; i < orden.length - 1; i++) {
          sumaIzq += orden[i].r; cuadIzq += orden[i].r * orden[i].r;
          const nIzq = i + 1, nDer = orden.length - nIzq;
          if (orden[i].x === orden[i + 1].x) continue;
          const sumaDer = suma - sumaIzq, cuadDer = sumaCuad - cuadIzq;
          const rss = cuadIzq - sumaIzq * sumaIzq / nIzq + cuadDer - sumaDer * sumaDer / nDer;
          if (mejor === null || rss < mejor.rss - 1e-10)
            mejor = { rss, corte: (orden[i].x + orden[i + 1].x) / 2, izq: orden.slice(0, nIzq), der: orden.slice(nIzq) };
        }
      }
      if (mejor) return { hoja: false, corte: mejor.corte, izq: nodo(mejor.izq, prof + 1), der: nodo(mejor.der, prof + 1) };
      return { hoja: true, valor: m };
    }
    return nodo(filas, 0);
  }
  function predecir(t, x) { while (!t.hoja) t = x <= t.corte ? t.izq : t.der; return t.valor; }

  let modelo;
  function ajustar() {
    const base = media(entreno.map(f => f.y));
    const predEnt = entreno.map(() => base), predVal = valida.map(() => base);
    const etapas = [{ ent: rmse(entreno, predEnt), val: rmse(valida, predVal) }];
    const arboles = [];
    for (let b = 1; b <= MAX_ARBOLES; b++) {
      const t = arbol(entreno.map((f, i) => ({ x: f.x, r: f.y - predEnt[i] })), ajustes.prof);
      arboles.push(t);
      entreno.forEach((f, i) => { predEnt[i] += ajustes.tasa * predecir(t, f.x); });
      valida.forEach((f, i) => { predVal[i] += ajustes.tasa * predecir(t, f.x); });
      etapas.push({ ent: rmse(entreno, predEnt), val: rmse(valida, predVal) });
    }
    const curva = rejilla.map(x => { let v = base; for (let b = 0; b < ajustes.arboles; b++) v += ajustes.tasa * predecir(arboles[b], x); return v; });
    const mejor = etapas.reduce((a, e, i) => (e.val < etapas[a].val ? i : a), 0);
    modelo = { etapas, curva, mejor };
  }

  const coma = (v, d = 2) => v.toFixed(d).replace('.', ',').replace('-', '−');
  const n2 = v => Number(v).toFixed(2);
  const trazo = pts => pts.map(([x, y], i) => (i ? 'L' : 'M') + n2(x) + ' ' + n2(y)).join(' ');
  const texto = (x, y, t, ancla = 'middle') => `<text x="${x}" y="${y}" fill="${COLOR.azulOscuro}" font-size="15" font-family="Roboto, system-ui, sans-serif" text-anchor="${ancla}">${t}</text>`;

  function dibujarAjuste() {
    const w = 640, h = 300, x0 = 46, x1 = 628, y0 = 10, y1 = 268;
    const ys = entreno.concat(valida).map(p => p.y);
    const bajo = Math.floor(Math.min(...ys) - 0.5), alto = Math.ceil(Math.max(...ys) + 0.5);
    const X = x => x0 + x * (x1 - x0), Y = y => y1 - (y - bajo) / (alto - bajo) * (y1 - y0);
    let s = `<rect width="${w}" height="${h}" fill="${COLOR.fondo}"/>`;
    for (let j = 0; j <= 4; j++) {
      const v = bajo + j * (alto - bajo) / 4, yy = Y(v);
      s += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" stroke="${COLOR.rejilla}"/>` + texto(x0 - 8, yy + 5, coma(v, 1), 'end');
    }
    for (let j = 0; j <= 5; j++) s += texto(X(j / 5), 292, coma(j / 5, 1));
    s += `<path d="${trazo(modelo.curva.map((v, i) => [X(rejilla[i]), Y(v)]))}" stroke="${COLOR.naranja}" stroke-width="4" fill="none" stroke-linejoin="round"/>`;
    for (const p of valida) s += `<circle cx="${n2(X(p.x))}" cy="${n2(Y(p.y))}" r="5.5" fill="${COLOR.fondo}" stroke="${COLOR.azul}" stroke-width="2.5"/>`;
    for (const p of entreno) s += `<circle cx="${n2(X(p.x))}" cy="${n2(Y(p.y))}" r="5" fill="${COLOR.gris}" fill-opacity="0.75"/>`;
    $('grafAjuste').innerHTML = s;
  }

  function dibujarError() {
    const w = 440, h = 300, x0 = 52, x1 = 428, y0 = 10, y1 = 268;
    const maxY = Math.max(1, Math.ceil(modelo.etapas[0].val * 1.2 * 2) / 2);
    const X = i => x0 + i / MAX_ARBOLES * (x1 - x0), Y = y => y1 - y / maxY * (y1 - y0);
    let s = `<rect width="${w}" height="${h}" fill="${COLOR.fondo}"/>`;
    for (let j = 0; j <= 4; j++) {
      const v = maxY * j / 4, yy = Y(v);
      s += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" stroke="${COLOR.rejilla}"/>` + texto(x0 - 8, yy + 5, coma(v, 1), 'end');
    }
    for (let j = 0; j <= 4; j++) s += texto(X(j * 15), 292, String(j * 15));
    for (const [clave, color] of [['ent', COLOR.gris], ['val', COLOR.azul]]) {
      s += `<path d="${trazo(modelo.etapas.map((e, i) => [X(i), Y(e[clave])]))}" stroke="${color}" stroke-width="3.5" fill="none"/>`;
      s += `<circle cx="${n2(X(ajustes.arboles))}" cy="${n2(Y(modelo.etapas[ajustes.arboles][clave]))}" r="7" fill="${color}" stroke="${COLOR.fondo}" stroke-width="2"/>`;
    }
    const xb = X(ajustes.arboles);
    s += `<line x1="${xb}" y1="${y0}" x2="${xb}" y2="${y1}" stroke="${COLOR.azulOscuro}" stroke-width="1.5" stroke-dasharray="5 6"/>`;
    $('grafError').innerHTML = s;
  }

  function actualizar() {
    ajustar(); dibujarAjuste(); dibujarError();
    const e = modelo.etapas[ajustes.arboles];
    $('valorArboles').textContent = ajustes.arboles;
    $('arboles').value = ajustes.arboles;
    $('rmseEnt').textContent = coma(e.ent);
    $('rmseVal').textContent = coma(e.val);
    $('mejorB').textContent = `${modelo.mejor} ${modelo.mejor === 1 ? 'árbol' : 'árboles'}`;
  }

  $('arboles').addEventListener('input', ev => { ajustes.arboles = +ev.target.value; actualizar(); });
  function botones(id, clave) {
    const grupo = $(id);
    for (const b of grupo.querySelectorAll('button')) b.setAttribute('aria-pressed', String(+b.dataset.valor === ajustes[clave]));
    grupo.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-valor]');
      if (!b) return;
      ajustes[clave] = +b.dataset.valor;
      for (const otro of grupo.querySelectorAll('button')) otro.setAttribute('aria-pressed', String(otro === b));
      actualizar();
    });
  }
  botones('botonesTasa', 'tasa');
  botones('botonesProf', 'prof');
  actualizar();

  // Dentro del deck: las teclas de avance pasan a Reveal (API postMessage), salvo las flechas sobre un deslizador
  document.addEventListener('keydown', ev => {
    if (window.parent === window) return;
    const enDeslizador = ev.target instanceof HTMLInputElement && ev.target.type === 'range';
    const enBoton = ev.target instanceof HTMLButtonElement;
    const metodos = { PageDown: 'next', PageUp: 'prev', ArrowRight: 'next', ArrowLeft: 'prev', ArrowDown: 'next', ArrowUp: 'prev', ' ': 'next' };
    const metodo = metodos[ev.key];
    if (!metodo) return;
    if (enDeslizador && ev.key.startsWith('Arrow')) return;
    if (enBoton && ev.key === ' ') return;
    window.parent.postMessage(JSON.stringify({ method: metodo }), '*');
    ev.preventDefault();
  });
})();
</script>
</body>
</html>
