<title>Simulador de una red de una capa</title>
<!--
  Simulador del deck 1 del tema 6 (el perceptrón multicapa), slide «Entrena una red de una capa».
  Creado el 28-10-2026 (tarea T6-01; plan en ../../plan_tema_06.md, sección 7). Página autónoma, sin
  dependencias externas, con el aspecto del simulador de optimizadores del deck 2 (../../semana_2/simuladores/).

  Datos: las 300 observaciones simuladas del gancho y de las slides 5 y 7 del deck,
    x uniforme en [0, 6], y = 1 + sen(x) + ruido normal de desviación típica 0,2, semilla 42 de numpy.
  Las escribe ../datos_red_una_capa.py en la constante DATOS del script (entre sus dos marcas de comentario),
  redondeadas a 6 decimales; el deck y su cuaderno compañero las regeneran con la misma función.

  La red: una capa oculta con K neuronas (1-10) y salida lineal,
    zₖ = wₖ x̃ + bₖ,  hₖ = g(zₖ),  f(x) = β₀ + Σₖ βₖ hₖ,
  con x̃ = x estandarizada (media y desviación típica de las 300 observaciones; los gráficos usan x en su escala)
  y g la activación elegida (ReLU, tangente hiperbólica, sigmoide o identidad).
  Pesos iniciales como en Keras: Glorot uniforme (límites √(6/(1+K)) en la capa oculta y √(6/(K+1)) en la de
  salida, primero los K pesos w y después los K pesos β, con un generador mulberry32 sembrado con la semilla),
  sesgos a cero. Pérdida: error cuadrático medio. Cada época es una actualización de Adam con el gradiente de
  las 300 observaciones (lote completo), con β₁ = 0,9, β₂ = 0,999 y ε = 10⁻⁷ (valores por defecto de Keras).

  Valores por defecto: K = 3, ReLU, η = 0,05, semilla 127. Entrena 120 épocas por segundo y para en la época
  1000 (unos 8 s). K, la activación y la semilla vuelven a la época 0; η cambia sin reiniciar. Con los sesgos a
  cero, en la época 0 todos los codos están en la media de x (2,92). El eje del RMSE llega a 1, o al medio punto
  por encima del RMSE inicial si este es mayor.
  Qué debe verse (comprobado en Node y en Chrome, 28-10-2026; batch_logs/tema_06_2026-10-28/simulador_red_una_capa/):
    ReLU, semilla 127: K = 1, un codo en x = 4,83 (RMSE 0,420); K = 2, codos en 1,89 y 4,18 (0,368);
      K = 3, codos en 1,56 y 4,5 y una neurona activa en todo el rango (0,210, el nivel del ruido, hacia la
      época 400); K = 10, más codos y 0,20 en unas 100 épocas.
    Identidad, con cualquier K: la recta de mínimos cuadrados (0,437).
    Tangente hiperbólica, K = 3: curva suave, 0,223 en la época 1000.
    Semillas 128, 129 y 130 con K = 3 ReLU: 0,267, 0,420 (un codo) y 0,762 (plana: todas las neuronas a cero
      en el rango de x). Con K = 10, las cuatro semillas llegan a 0,20-0,23.
    η = 0,001: 0,399 en la época 1000 (lento); η = 0,2: se queda en 0,368; η = 1: plana.
  Parámetros iniciales por URL: ?K=3&activacion=relu&tasa=0.05&semilla=127&epocas=0
  (activacion: relu, tanh, sigmoide, identidad; epocas: entrena ese número de épocas al cargar).
-->

    for (let j = 0; j < p.length; j++) {
      red.m[j] = b1 * red.m[j] + (1 - b1) * g[j];
      red.s[j] = b2 * red.s[j] + (1 - b2) * g[j] * g[j];
      const mh = red.m[j] / (1 - b1 ** red.t), sh = red.s[j] / (1 - b2 ** red.t);
      p[j] -= ajustes.tasa * mh / (Math.sqrt(sh) + eps);
    }
    red.w = p.slice(0, K); red.b = p.slice(K, 2 * K); red.beta = p.slice(2 * K, 3 * K); red.beta0 = p[3 * K];
  }

  // Ajustes iniciales (por URL si vienen)
  const ajustes = { K: 3, act: 'relu', tasa: 0.05, semilla: 127 };
  const params = new URLSearchParams(location.search);
  if (params.has('K')) ajustes.K = Math.min(10, Math.max(1, Math.round(+params.get('K'))));
  if (ACT[params.get('activacion')]) ajustes.act = params.get('activacion');
  if (params.has('tasa')) ajustes.tasa = Math.min(1, Math.max(0.001, +params.get('tasa')));
  if (params.has('semilla')) ajustes.semilla = Math.max(1, Math.round(+params.get('semilla')));

  // Formato de las cifras: coma decimal y signo menos
  const coma = (v, d) => v.toFixed(d).replace('.', ',').replace('-', '−');
  const tasaDe = k => Math.pow(10, -3 + k / 20), posDe = v => Math.round((Math.log10(v) + 3) * 20);
  const tasaTexto = v => (v >= 0.1 ? coma(v, 2) : v >= 0.01 ? coma(v, 3) : coma(v, 4)).replace(/0+$/, '').replace(/,$/, '');
  const n2 = v => Number(v).toFixed(2);
  const texto = (x, y, t, ancla = 'middle', color = COLOR.azulOscuro, extra = '') =>
    `<text x="${n2(x)}" y="${n2(y)}" fill="${color}" font-size="22" font-family="Roboto, system-ui, sans-serif" text-anchor="${ancla}"${extra}>${t}</text>`;
  // Marcas «redondas» de un eje: paso de 1, 2, 2,5 o 5 por una potencia de 10
  function pasoRedondo(crudo) {
    const pot = Math.pow(10, Math.floor(Math.log10(crudo)));
    return [1, 2, 2.5, 5, 10].map(k => k * pot).find(k => k >= crudo - 1e-12);
  }
  const decimalesDe = paso => Math.max(0, -Math.floor(Math.log10(paso) + 1e-9) + (Math.abs(paso / Math.pow(10, Math.floor(Math.log10(paso))) - 2.5) < 1e-9 ? 1 : 0));

  // Rejilla de x para dibujar las curvas
  const XS = Array.from({ length: 241 }, (_, i) => 6 * i / 240), ZS = XS.map(v => (v - media) / dt);

  // Panel de datos: ejes y observaciones fijos, curva de la red en cada fotograma
  const DAT = { izq: 72, der: 970, arr: 12, aba: 286, ymin: -1, ymax: 3 };
  const xD = v => DAT.izq + v / 6 * (DAT.der - DAT.izq);
  const yD = v => DAT.aba - (v - DAT.ymin) / (DAT.ymax - DAT.ymin) * (DAT.aba - DAT.arr);
  const fondoDatos = (() => {
    let s = `<rect width="1000" height="340" fill="${COLOR.fondo}"/>`;
    for (let v = DAT.ymin; v <= DAT.ymax; v++) s += `<line x1="${DAT.izq}" y1="${n2(yD(v))}" x2="${DAT.der}" y2="${n2(yD(v))}" stroke="${COLOR.rejilla}"/>` + texto(DAT.izq - 12, yD(v) + 8, coma(v, 0), 'end');
    for (let v = 0; v <= 6; v++) s += texto(xD(v), DAT.aba + 28, String(v));
    s += texto((DAT.izq + DAT.der) / 2, 336, 'x') + texto(22, (DAT.arr + DAT.aba) / 2 + 8, 'y');
    for (let i = 0; i < n; i++) s += `<circle cx="${n2(xD(DATOS.x[i]))}" cy="${n2(yD(Yv[i]))}" r="4.5" fill="${COLOR.azul}" fill-opacity="0.45"/>`;
    return s;
  })();
  function dibujarDatos(red) {
    const pts = ZS.map((z, i) => [xD(XS[i]), yD(Math.min(DAT.ymax + 0.3, Math.max(DAT.ymin - 0.3, predecir(red, z))))]);
    const d = pts.map(([a, b], i) => (i ? 'L' : 'M') + n2(a) + ' ' + n2(b)).join(' ');
    $('grafDatos').innerHTML = fondoDatos +
      `<clipPath id="recorteDatos"><rect x="${DAT.izq}" y="${DAT.arr}" width="${DAT.der - DAT.izq}" height="${DAT.aba - DAT.arr}"/></clipPath>` +
      `<path d="${d}" stroke="${COLOR.naranja}" stroke-width="5" fill="none" stroke-linejoin="round" clip-path="url(#recorteDatos)"/>`;
  }

  // Panel de neuronas: βₖ hₖ(x) de cada neurona, con escala simétrica que se ajusta a las contribuciones
  const NEU = { izq: 72, der: 940, arr: 12, aba: 250 };
  const xN = v => NEU.izq + v / 6 * (NEU.der - NEU.izq);
  function dibujarNeuronas(red) {
    const act = ACT[ajustes.act];
    const curvas = red.beta.map((bk, k) => ZS.map(z => bk * act.g(red.w[k] * z + red.b[k])));
    const maxAbs = Math.max(0.5, ...curvas.flat().map(Math.abs));
    const paso = pasoRedondo(maxAbs / 2), lim = Math.ceil(maxAbs / paso - 1e-9) * paso, dec = decimalesDe(paso);
    const yN = v => NEU.aba - (v + lim) / (2 * lim) * (NEU.aba - NEU.arr);
    let s = `<rect width="1000" height="300" fill="${COLOR.fondo}"/>`;
    for (let v = -lim; v <= lim + paso / 2; v += paso) {
      const cero = Math.abs(v) < paso / 1e6;
      s += `<line x1="${NEU.izq}" y1="${n2(yN(v))}" x2="${NEU.der}" y2="${n2(yN(v))}" stroke="${cero ? COLOR.gris : COLOR.rejilla}"${cero ? ' stroke-width="1.5"' : ''}/>` +
        texto(NEU.izq - 12, yN(v) + 8, coma(cero ? 0 : v, dec), 'end');
    }
    for (let v = 0; v <= 6; v++) s += texto(xN(v), NEU.aba + 28, String(v));
    s += texto((NEU.izq + NEU.der) / 2, 298, 'x');
    // Rótulos de las neuronas al final de cada curva, separados para que no se pisen
    const rotulos = curvas.map((c, k) => ({ k, y: yN(c[c.length - 1]) })).sort((p, q) => p.y - q.y);
    for (let i = 1; i < rotulos.length; i++) rotulos[i].y = Math.max(rotulos[i].y, rotulos[i - 1].y + 23);
    const exceso = rotulos.length ? rotulos[rotulos.length - 1].y - (NEU.aba + 4) : 0;
    if (exceso > 0) for (const r of rotulos) r.y -= exceso;
    curvas.forEach((c, k) => {
      const d = c.map((v, i) => (i ? 'L' : 'M') + n2(xN(XS[i])) + ' ' + n2(yN(v))).join(' ');
      const color = COLOR_NEURONA[k % 5], trazos = k >= 5 ? ' stroke-dasharray="12 7"' : '';
      s += `<path d="${d}" stroke="${color}" stroke-width="4" fill="none" stroke-linejoin="round"${trazos}/>`;
    });
    for (const r of rotulos) s += texto(NEU.der + 10, r.y + 8, String(r.k + 1), 'start', COLOR_NEURONA[r.k % 5], ' font-weight="700"');
    $('grafNeuronas').innerHTML = s;
  }

  // Panel del RMSE: historia por época, con la recta de mínimos cuadrados como referencia.
  // El eje vertical llega a 1 o, si el RMSE inicial es mayor, al medio punto siguiente (como mucho 3); se fija al reiniciar
  const RM = { izq: 74, der: 612, arr: 14, aba: 270, ymax: 1 };
  const xR = e => RM.izq + e / MAX_EPOCAS * (RM.der - RM.izq);
  const yR = v => RM.aba - Math.min(v, RM.ymax) / RM.ymax * (RM.aba - RM.arr);
  let fondoRmse = '';
  function prepararRmse(inicial) {
    RM.ymax = Math.min(3, Math.max(1, Math.ceil(inicial * 2 - 1e-9) / 2));
    const paso = RM.ymax > 1 ? 0.5 : 0.2;
    let s = `<rect width="640" height="330" fill="${COLOR.fondo}"/>`;
    for (let v = 0; v <= RM.ymax + 1e-9; v += paso) s += `<line x1="${RM.izq}" y1="${n2(yR(v))}" x2="${RM.der}" y2="${n2(yR(v))}" stroke="${COLOR.rejilla}"/>` + texto(RM.izq - 10, yR(v) + 8, coma(v, 1), 'end');
    for (let e = 0; e <= MAX_EPOCAS; e += 250) s += texto(xR(e), RM.aba + 28, String(e));
    s += texto((RM.izq + RM.der) / 2, 326, 'épocas (lote completo)');
    s += `<line x1="${RM.izq}" y1="${n2(yR(rmseRecta))}" x2="${RM.der}" y2="${n2(yR(rmseRecta))}" stroke="${COLOR.gris}" stroke-width="2.5" stroke-dasharray="10 8"/>` +
      texto(RM.der - 4, yR(rmseRecta) - 10, `recta de mínimos cuadrados (${coma(rmseRecta, 3)})`, 'end', COLOR.gris);
    fondoRmse = s;
  }
  function dibujarRmse() {
    const d = historia.map((v, e) => (e ? 'L' : 'M') + n2(xR(e)) + ' ' + n2(yR(v))).join(' ');
    const e = historia.length - 1;
    $('grafRmse').innerHTML = fondoRmse +
      `<path d="${d}" stroke="${COLOR.naranja}" stroke-width="4" fill="none" stroke-linejoin="round"/>` +
      `<circle cx="${n2(xR(e))}" cy="${n2(yR(historia[e]))}" r="7" fill="${COLOR.naranja}" stroke="${COLOR.fondo}" stroke-width="2"/>`;
  }

  // Estado del entrenamiento
  let red, historia, animacion = null, ultimo = 0, resto = 0;
  function dibujar() {
    dibujarDatos(red); dibujarNeuronas(red); dibujarRmse();
    $('epoca').textContent = red.t; $('rmse').textContent = coma(historia[historia.length - 1], 3);
  }
  function reiniciar() {
    red = iniciar(ajustes.K, ajustes.semilla); historia = [rmse(red)]; resto = 0; prepararRmse(historia[0]); dibujar();
  }
  function entrenarHasta(epocas) {
    while (red.t < Math.min(epocas, MAX_EPOCAS)) { epoca(red); historia.push(rmse(red)); }
  }
  function parar() {
    cancelAnimationFrame(animacion); animacion = null; $('entrenar').textContent = 'Entrenar';
  }
  function fotograma(ahora) {
    const dtSeg = Math.min(0.1, (ahora - ultimo) / 1000); ultimo = ahora;
    resto += dtSeg * EPOCAS_POR_SEGUNDO;
    const k = Math.floor(resto); resto -= k;
    entrenarHasta(red.t + k); dibujar();
    animacion = red.t < MAX_EPOCAS ? requestAnimationFrame(fotograma) : (parar(), null);
  }
  function arrancar() {
    if (red.t >= MAX_EPOCAS) reiniciar();
    $('entrenar').textContent = 'Pausa'; ultimo = performance.now();
    animacion = requestAnimationFrame(fotograma);
  }

  // Mandos: K, activación y semilla vuelven a la época 0 (y siguen entrenando si estaba en marcha); η no
  function mostrarMandos() {
    $('valorK').textContent = ajustes.K; $('neuronas').value = ajustes.K;
    $('valorTasa').textContent = tasaTexto(ajustes.tasa);
    $('valorSemilla').textContent = ajustes.semilla;
    for (const b of $('botonesActivacion').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.valor === ajustes.act));
  }
  function cambiarRed() {
    const enMarcha = animacion !== null;
    if (enMarcha) parar();
    mostrarMandos(); reiniciar();
    if (enMarcha) arrancar();
  }
  $('neuronas').addEventListener('input', ev => { ajustes.K = +ev.target.value; cambiarRed(); });
  $('botonesActivacion').addEventListener('click', ev => { const b = ev.target.closest('button[data-valor]'); if (b) { ajustes.act = b.dataset.valor; cambiarRed(); } });
  $('semillaMenos').addEventListener('click', () => { ajustes.semilla = Math.max(1, ajustes.semilla - 1); cambiarRed(); });
  $('semillaMas').addEventListener('click', () => { ajustes.semilla += 1; cambiarRed(); });
  $('tasa').addEventListener('input', ev => { ajustes.tasa = tasaDe(+ev.target.value); mostrarMandos(); });
  $('entrenar').addEventListener('click', () => (animacion ? parar() : arrancar()));
  $('reiniciar').addEventListener('click', () => { parar(); reiniciar(); });

  $('tasa').value = posDe(ajustes.tasa);
  mostrarMandos(); reiniciar();
  if (params.has('epocas')) { entrenarHasta(Math.max(0, Math.round(+params.get('epocas')))); dibujar(); }

  // Dentro del deck: las teclas de avance pasan a Reveal (API postMessage), salvo las flechas sobre un deslizador
  document.addEventListener('keydown', ev => {
    if (window.parent === window) return;
    const enDeslizador = ev.target instanceof HTMLInputElement && ev.target.type === 'range';
    const enBoton = ev.target instanceof HTMLButtonElement;
    const metodos = { PageDown: 'next', PageUp: 'prev', ArrowRight: 'next', ArrowLeft: 'prev', ArrowDown: 'next', ArrowUp: 'prev', ' ': 'next' };
    const metodo = metodos[ev.key];
    if (!metodo) return;
    if (enDeslizador && ev.key.startsWith('Arrow')) return;
    if (enBoton && ev.key === ' ') return;
    window.parent.postMessage(JSON.stringify({ method: metodo }), '*');
    ev.preventDefault();
  });
})();
</script>
</body>
