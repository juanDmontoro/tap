<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa mental TAP</title>
<meta name="description" content="Mapa mental interactivo de Técnicas Avanzadas de Predicción en Negocios: estimadores del curso y decisiones de aprendizaje supervisado.">
<!-- Única dependencia externa (opcional): KaTeX para las fórmulas del panel. Sin ella, las fórmulas se muestran como texto. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
:root {
  /* Paleta de tap_web.scss */
  --tap-blue: #447099;
  --tap-navy: #1F3A5F;
  --tap-terracotta: #E07A5F;
  --tap-sage: #81B29A;
  --tap-gray: #6C757D;
  --tap-cream: #F7F3EF;
  --tap-light: #F2F5F8;
  --text: #2B2B2B;
  --bg: var(--tap-light);
  --surface: #ffffff;
  --border: #d5dee8;
  --blue-soft: #e3ebf3;
  --terra-soft: #fbe9e3;
  --sage-soft: #e5f1ea;
  --edge: #9fb2c6;
  --link-faint: rgba(224, 122, 95, .16);
  --font: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --panel-w: 410px;
  --header-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; }

/* ---------- Cabecera ---------- */
header.bar {
  position: fixed; inset: 0 0 auto 0; height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: var(--tap-blue); color: #fff;
  z-index: 30;
}
.bar h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.bar h1 small { font-weight: 400; opacity: .85; margin-left: 6px; }
.search { position: relative; flex: 1 1 260px; max-width: 360px; margin-left: auto; }
.search input {
  width: 100%; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,.5);
  background: rgba(255,255,255,.96); color: var(--text); padding: 0 10px 0 32px; font: inherit; font-size: 15px;
}
.search input:focus { outline: 2px solid var(--tap-terracotta); outline-offset: 1px; }
.search svg { position: absolute; left: 9px; top: 9px; width: 16px; height: 16px; color: var(--tap-gray); pointer-events: none; }
.results {
  position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(31,58,95,.18);
  list-style: none; margin: 0; padding: 4px; max-height: 60vh; overflow: auto; display: none;
}
.results.show { display: block; }
.results li button {
  display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none;
  padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--text);
}
.results li button:hover, .results li button.active { background: var(--blue-soft); }
.results .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--tap-gray); white-space: nowrap; }
.results .empty { padding: 8px; color: var(--tap-gray); font-size: 14px; }
.tools { display: flex; gap: 6px; }
.tbtn {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.55);
  background: transparent; color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { background: rgba(255,255,255,.15); }
.tbtn[aria-pressed="true"] { background: #fff; color: var(--tap-blue); }
.tbtn:focus-visible { outline: 2px solid var(--tap-terracotta); outline-offset: 1px; }

/* ---------- Lienzo del mapa ---------- */
#viewport {
  position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0;
  overflow: hidden; touch-action: none; cursor: grab;
  background:
    radial-gradient(circle at 1px 1px, rgba(68,112,153,.13) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
}
#viewport.dragging { cursor: grabbing; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path { fill: none; }
#edges .tree { stroke: var(--edge); stroke-width: 2; }
#edges .tree.dec { stroke: #e8b3a4; }
#edges .xlink { stroke: var(--link-faint); stroke-width: 1.4; transition: stroke .15s, stroke-width .15s, opacity .15s; }
#edges .xlink.agg { stroke-dasharray: 5 4; }
body.has-focus #edges .xlink { opacity: .25; }
body.has-focus #edges .xlink.hl { opacity: 1; stroke: var(--tap-terracotta); stroke-width: 2.6; }
body.has-focus #edges .tree { opacity: .45; }

.node {
  position: absolute; display: flex; align-items: center; gap: 8px;
  border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface);
  padding: 6px 10px; cursor: pointer; user-select: none; -webkit-user-select: none;
  box-shadow: 0 1px 2px rgba(31,58,95,.08);
  transition: opacity .15s, box-shadow .15s, border-color .15s, background-color .15s;
  line-height: 1.2;
}
.node:hover { box-shadow: 0 3px 10px rgba(31,58,95,.18); }
.node:focus-visible { outline: 3px solid var(--tap-terracotta); outline-offset: 2px; }
.node .txt { flex: 1 1 auto; min-width: 0; }
.node .lbl { display: block; font-weight: 600; overflow-wrap: anywhere; }
.node .sub { display: block; font-size: 12.5px; color: var(--tap-gray); margin-top: 2px; }
.node .tema { font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
.node .tog {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor;
  background: transparent; color: inherit; font-size: 15px; line-height: 17px; padding: 0; cursor: pointer; font-weight: 700;
}
.node .tog:focus-visible { outline: 2px solid var(--tap-terracotta); outline-offset: 1px; }
.node .sim {
  flex: 0 0 auto; font-size: 11.5px; padding: 2px 7px; border-radius: 5px;
  border: 1px dashed var(--tap-gray); background: var(--tap-cream); color: var(--tap-gray);
}
.sim:disabled { cursor: not-allowed; opacity: .75; }

/* Tipo 1: objetivo (marino) */
.node.objetivo { background: var(--tap-navy); border-color: var(--tap-navy); color: #fff; padding: 10px 12px; }
.node.objetivo .lbl { font-size: 17px; }
.node.objetivo .sub { color: #dbe5f0; font-size: 14px; }
/* Tipo 2: familias y estimadores (azul) */
.node.familia { background: var(--tap-blue); border-color: var(--tap-blue); color: #fff; }
.node.familia .sub { color: #e3ebf3; }
.node.estimador { border-color: #b9cbdd; border-left: 5px solid var(--tap-blue); }
.node.estimador .lbl { color: var(--tap-navy); }
.node.estimador .tema { background: var(--blue-soft); color: var(--tap-blue); }
.node.estimador.pendiente { border-style: dashed; border-left-style: solid; background: #fbfcfd; }
.node.familia.pendiente { background: #6f8fb0; border: 1.5px dashed #ffffff; }
.node.pendiente .tema { background: var(--tap-cream); color: var(--tap-gray); }
/* Tipo 3: decisiones transversales (terracota) */
.node.hub { background: var(--tap-terracotta); border-color: var(--tap-terracotta); color: #fff; }
.node.hub .sub { color: #fff3ef; }
.node.decision { border-color: #efc2b5; border-left: 5px solid var(--tap-terracotta); background: #fff; }
.node.decision .lbl { color: #8f3b25; }

/* Estados */
.node.sel { box-shadow: 0 0 0 3px var(--tap-sage), 0 6px 16px rgba(31,58,95,.25); }
.node.rel { box-shadow: 0 0 0 2px var(--tap-terracotta), 0 3px 10px rgba(31,58,95,.15); }
.node.decision.rel, .node.estimador.rel { background: #fff7f4; }
body.has-focus .node.dimmed { opacity: .32; }
body.searching .node:not(.match) { opacity: .28; }
.node.match { box-shadow: 0 0 0 3px var(--tap-sage); }

/* Leyenda y ayuda */
.legend {
  position: fixed; left: 12px; bottom: 12px; z-index: 20; background: rgba(255,255,255,.94);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; max-width: calc(100vw - 24px);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }
.legend .hint { color: var(--tap-gray); }
.zoom { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; flex-direction: column; gap: 6px; transition: right .2s; }
.zoom button {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
  color: var(--tap-navy); font-size: 18px; cursor: pointer; box-shadow: 0 1px 3px rgba(31,58,95,.12);
}
.zoom button:hover { background: var(--blue-soft); }
body.panel-open .zoom { right: calc(var(--panel-w) + 12px); }

/* ---------- Panel lateral ---------- */
#panel {
  position: fixed; top: var(--header-h); right: 0; bottom: 0; width: var(--panel-w); max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border); z-index: 25;
  box-shadow: -8px 0 24px rgba(31,58,95,.12);
  transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column;
}
body.panel-open #panel { transform: none; }
.p-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); position: relative; }
.p-kind { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.p-kind.objetivo { color: var(--tap-navy); }
.p-kind.familia, .p-kind.estimador { color: var(--tap-blue); }
.p-kind.hub, .p-kind.decision { color: #c4583b; }
.p-head h2 { margin: 4px 36px 6px 0; font-size: 21px; line-height: 1.2; color: var(--tap-navy); }
.p-close {
  position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 6px;
  border: 1px solid var(--border); background: #fff; font-size: 18px; cursor: pointer; color: var(--tap-navy);
}
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--blue-soft); color: var(--tap-navy); }
.badge.warn { background: var(--tap-cream); color: #7a5b4a; border: 1px dashed #c9b6a6; }
.p-body { padding: 4px 16px 24px; overflow-y: auto; flex: 1 1 auto; line-height: 1.45; -webkit-overflow-scrolling: touch; }
.p-body h3 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--tap-blue);
  margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--blue-soft);
}
.p-body p { margin: 6px 0; }
.p-body ul { margin: 6px 0; padding-left: 18px; }
.p-body li { margin: 4px 0; }
.p-body code { font-family: var(--mono); font-size: .88em; background: var(--tap-cream); color: var(--tap-navy); padding: 0 3px; border-radius: 3px; }
.idea { font-size: 16px; color: var(--tap-navy); }
.formula { background: var(--tap-light); border-radius: 6px; padding: 4px 10px; overflow-x: auto; margin: 8px 0; }
dl.peculiar { margin: 6px 0; }
dl.peculiar dt { font-weight: 700; color: var(--tap-navy); font-size: 13.5px; margin-top: 8px; }
dl.peculiar dd { margin: 2px 0 0 0; }
table.hp { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0; }
table.hp th { text-align: left; background: var(--tap-light); color: var(--tap-navy); padding: 5px 6px; font-weight: 600; }
table.hp td code { overflow-wrap: anywhere; }
table.hp td { padding: 5px 6px; border-top: 1px solid #e6ecf2; vertical-align: top; }
table.hp tr:nth-child(even) td { background: #fafbfd; }
.links { list-style: none; padding: 0 !important; }
.links li { margin: 7px 0; }
.chip {
  display: inline-block; font: inherit; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 12px; cursor: pointer;
  border: 1px solid #efc2b5; background: var(--terra-soft); color: #8f3b25; margin: 0 4px 2px 0;
}
.chip.est { border-color: #b9cbdd; background: var(--blue-soft); color: var(--tap-navy); }
.chip:hover { filter: brightness(.96); }
.reason { display: block; font-size: 13.5px; color: #4a4f55; margin-top: 2px; }
.mat a {
  display: inline-block; margin: 3px 6px 3px 0; padding: 3px 9px; border: 1px solid #a9bfd5; border-radius: 5px;
  color: var(--tap-blue); text-decoration: none; font-size: 13.5px;
}
.mat a:hover { background: var(--tap-light); }
.simbox { margin-top: 18px; padding: 10px; border: 1px dashed var(--tap-gray); border-radius: 8px; background: var(--tap-cream); font-size: 13.5px; color: #5a5f64; }
.simbox button { margin-right: 8px; font-size: 14px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--tap-gray); background: #fff; color: var(--tap-gray); }

/* ---------- Vista en lista ---------- */
#outline {
  position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; overflow-y: auto; display: none;
  padding: 16px 16px 80px; background: var(--bg);
}
body.list-mode #outline { display: block; }
body.list-mode #viewport, body.list-mode .legend, body.list-mode .zoom { display: none; }
#outline .wrap { max-width: 860px; margin: 0 auto; }
#outline details { background: #fff; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
#outline summary { padding: 10px 12px; cursor: pointer; font-weight: 600; color: #fff; border-radius: 7px; list-style-position: inside; }
#outline details.familia > summary { background: var(--tap-blue); }
#outline details.hub > summary { background: var(--tap-terracotta); }
#outline ul { list-style: none; margin: 0; padding: 6px 8px 8px; }
#outline li button {
  width: 100%; text-align: left; border: 0; background: none; padding: 8px 8px; border-radius: 6px; cursor: pointer;
  font-size: 15px; color: var(--tap-navy); display: flex; justify-content: space-between; gap: 8px;
}
#outline li button:hover { background: var(--tap-light); }
#outline li button small { color: var(--tap-gray); white-space: nowrap; }
#outline .rootbtn {
  width: 100%; text-align: left; border: 0; border-radius: 8px; background: var(--tap-navy); color: #fff;
  padding: 12px 14px; font-size: 17px; font-weight: 600; cursor: pointer;
}
#outline .rootbtn small { display: block; font-weight: 400; opacity: .85; font-size: 14px; }

/* ---------- Móvil ---------- */
@media (max-width: 760px) {
  :root { --header-h: 96px; --panel-w: 100vw; }
  header.bar { flex-wrap: wrap; height: var(--header-h); padding: 8px 10px; gap: 8px; align-content: center; }
  .bar h1 { flex: 1 1 auto; font-size: 16px; }
  .bar h1 small { display: none; }
  .search { order: 3; flex: 1 1 100%; max-width: none; margin: 0; }
  .tools .wide { display: none; }
  #panel {
    top: auto; left: 0; right: 0; width: 100%; height: 64vh; border-left: 0; border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0; transform: translateY(105%); box-shadow: 0 -8px 24px rgba(31,58,95,.18);
  }
  body.panel-open .zoom { right: 12px; bottom: calc(64vh + 10px); }
  .legend { font-size: 11.5px; padding: 6px 8px; gap: 4px 10px; right: 60px; }
  .legend .hint { display: none; }
  body.panel-open .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Mapa de la asignatura <small>Técnicas Avanzadas de Predicción en Negocios</small></h1>
  <div class="search" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 10.5 15 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Buscar: lasso, AUC, poda, λ…" autocomplete="off" aria-label="Buscar en el mapa" aria-controls="results">
    <ul id="results" class="results" role="listbox" aria-label="Resultados"></ul>
  </div>
  <div class="tools">
    <button class="tbtn wide" id="expandAll" type="button" title="Desplegar todas las ramas">Desplegar</button>
    <button class="tbtn wide" id="collapseAll" type="button" title="Plegar las ramas de estimadores">Plegar</button>
    <button class="tbtn" id="listBtn" type="button" aria-pressed="false" title="Alternar entre mapa y lista">Lista</button>
  </div>
</header>

<div id="viewport" aria-label="Mapa mental. Arrastra para desplazarte; Ctrl + rueda o pellizco para acercar.">
  <div id="stage">
    <svg id="edges" aria-hidden="true"></svg>
  </div>
</div>

<nav id="outline" aria-label="Vista en lista"><div class="wrap"></div></nav>

<div class="legend" aria-hidden="true">
  <span><i style="background:var(--tap-navy)"></i>Objetivo</span>
  <span><i style="background:var(--tap-blue)"></i>Estimadores</span>
  <span><i style="background:var(--tap-terracotta)"></i>Decisiones</span>
  <span><i style="border:1.5px dashed var(--tap-gray);background:#fff"></i>Tema por publicar</span>
  <span class="hint">Pulsa un estimador para ver sus vínculos. Arrastra para moverte y usa Ctrl + rueda para acercar.</span>
</div>
<div class="zoom">
  <button type="button" id="zin" aria-label="Acercar">+</button>
  <button type="button" id="zout" aria-label="Alejar">−</button>
  <button type="button" id="zfit" aria-label="Ajustar a la pantalla" title="Ajustar a la pantalla">⤢</button>
</div>

<aside id="panel" aria-live="polite" aria-label="Detalle del nodo">
  <div class="p-head" id="phead"></div>
  <div class="p-body" id="pbody"></div>
</aside>

<script>
"use strict";
/* =====================================================================
   CONTENIDO
   Fuentes: planificacion.qmd, materiales.qmd y los decks de slides/
   (temas 1 a 4). Los temas 4 (boosting, voting, stacking), 5, 6 y 7
   aún no tienen deck publicado: su ficha se limita a lo que dicen la
   planificación, el deck de presentación y la tabla «Controlar la
   complejidad» del tema 1.
   ===================================================================== */
const R = String.raw;
const BASE = "https://juandmontoro.github.io/tap/";
const M = {
  t1a: ["Deck T1 · Fundamentos", "slides/01/semana_1/01_intro_2ML_sn.html"],
  t1b: ["Deck T1 · Regresión regularizada", "slides/01/semana_2/02_regression_plus_regularization_sn.html"],
  t1c: ["Deck T1 · Laboratorio", "slides/01/semana_1_clab/01_clab_resumen_sn.html"],
  t2:  ["Deck T2 · Evaluación y selección", "slides/02/02_evaluacion_seleccion_sn.html"],
  t2c: ["Deck T2 · Código esencial", "slides/02/semana_2/02_codigo_esencial_sn.html"],
  t3:  ["Deck T3 · GLM", "slides/03/03_glm_familias_sn.html"],
  t4:  ["Deck T4 · Árboles y bosques", "slides/04/04_arboles_bosques_sn.html"],
  m1:  ["Materiales del tema 1", "materiales.html#tema-1"],
  m2:  ["Materiales del tema 2", "materiales.html#tema-2"],
  m3:  ["Materiales del tema 3", "materiales.html#tema-3"],
  m4:  ["Materiales del tema 4", "materiales.html#tema-4"],
  plan:["Planificación", "planificacion.html"],
  pres:["Presentación del curso", "slides/0_presentacion/presentacion_2627_sn.html"]
};

const ROOT = {
  id: "objetivo", type: "objetivo",
  label: "Aprender f(X) para predecir y",
  sub: "y = f(X) + ε",
  idea: R`A partir de una muestra de casos con respuesta conocida estimamos una regla \(\hat f\) que prediga bien la respuesta \(y\) de casos nuevos. Por eso hablamos de aprendizaje supervisado.`,
  formula: R`\[y = f(X) + \epsilon\]\[f(X)=E(y\mid X),\qquad E(\epsilon\mid X)=0\]`,
  puntos: [
    R`En <b>regresión</b> la respuesta es numérica, como las ventas de una tienda o el precio de un producto. En <b>clasificación</b> es una categoría, como si un cliente abandona o si un préstamo resulta impagado, y el modelo predice la probabilidad de cada clase.`,
    R`\(f(X)\) es la media de la respuesta para unos valores dados de los predictores, y \(\hat f(X)\) es la regla que estimamos con una muestra. El término \(\epsilon\) recoge la variación de \(y\) que los predictores no permiten anticipar.`,
    R`El error de predicción tiene una parte <b>reducible</b>, que disminuye si estimamos mejor \(f\), y una parte <b>irreducible</b>, el ruido que permanece una vez conocido \(X\) y que limita la precisión de cualquier modelo.`,
    R`Para un \(x\) nuevo, promediando sobre las muestras de entrenamiento y sobre el ruido, el error esperado se descompone así:\[E[(y-\hat f(x))^2]=\underbrace{\left(E[\hat f(x)]-f(x)\right)^2}_{\text{sesgo}^2}+\underbrace{\mathrm{Var}(\hat f(x))}_{\text{varianza}}+\underbrace{\sigma^2}_{\text{ruido}}\]Mientras el sesgo y la varianza del estimador son reducibles, el ruido no lo es.`,
    R`Elegir un modelo predictivo exige dos decisiones: la <b>clase de funciones</b> (lineal, árbol, red neuronal…) y la <b>complejidad</b> que permitimos dentro de esa clase.`,
    R`Predecir y estimar el efecto causal de una intervención son objetivos distintos. Pueden compartir herramientas, pero el objetivo causal requiere además supuestos que identifiquen el efecto (tema 7).`
  ],
  materiales: ["t1a", "pres"]

/* =====================================================================
   ÍNDICES
   ===================================================================== */
const NODES = new Map();
NODES.set(ROOT.id, ROOT);
NODES.set(HUB.id, Object.assign(HUB, { parent: ROOT.id }));
FAMILIAS.forEach(f => { f.type = "familia"; f.parent = ROOT.id; f.children = []; NODES.set(f.id, f); });
DECISIONES.forEach(d => { d.type = "decision"; d.parent = HUB.id; d.back = []; NODES.set(d.id, d); });
ESTIMADORES.forEach(e => {
  e.type = "estimador"; e.parent = e.fam; NODES.set(e.id, e);
  NODES.get(e.fam).children.push(e.id);
  e.links.forEach(([d, why]) => {
    const dec = NODES.get(d);
    if (!dec) throw new Error("Decisión desconocida: " + d);
    dec.back.push([e.id, why]);
  });
});

/* =====================================================================
   ESTADO
   ===================================================================== */
const state = {
  open: { [ROOT.id]: true, [HUB.id]: true },
  sel: null, hover: null,
  view: { x: 0, y: 0, k: 1 },
  query: ""
};
FAMILIAS.forEach(f => state.open[f.id] = true);

const $ = s => document.querySelector(s);
const stage = $("#stage"), svg = $("#edges"), viewport = $("#viewport");
const SVGNS = "http://www.w3.org/2000/svg";
const isNarrow = () => window.matchMedia("(max-width: 760px)").matches;

/* =====================================================================
   NODOS (HTML)
   ===================================================================== */
const els = new Map();
function makeNode(n) {
  const el = document.createElement("div");
  el.className = "node " + n.type + (n.pendiente ? " pendiente" : "");
  el.dataset.id = n.id;
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  const label = n.label + (n.pendiente ? " (tema por publicar)" : "");
  el.setAttribute("aria-label", label);
  const txt = document.createElement("span");
  txt.className = "txt";
  txt.innerHTML = `<span class="lbl">${n.label}</span>` + (n.sub ? `<span class="sub">${n.sub}</span>` : "");
  el.appendChild(txt);
  if (n.type === "estimador") {
    const t = document.createElement("span");
    t.className = "tema"; t.textContent = n.tema; el.appendChild(t);
    const b = document.createElement("button");
    b.type = "button"; b.className = "sim"; b.disabled = true;
    b.dataset.simulador = n.id;
    b.textContent = "Simular";
    b.title = "Simulador: se activará en una fase posterior";
    b.setAttribute("aria-label", "Simular " + n.label + " (no disponible todavía)");
    el.appendChild(b);
  }
  if (n.type === "objetivo" || n.type === "familia" || n.type === "hub") {
    const t = document.createElement("button");
    t.type = "button"; t.className = "tog"; t.dataset.tog = n.id;
    el.appendChild(t);
  }
  stage.appendChild(el);
  els.set(n.id, el);
}
[ROOT, ...FAMILIAS, ...ESTIMADORES, HUB, ...DECISIONES].forEach(makeNode);

/* =====================================================================
   DISPOSICIÓN
   Col. 0: objetivo · col. 1: familias · col. 2: estimadores ·
   col. 3: decisiones (con el nodo «Decisiones» encima y una espina a la derecha).
   ===================================================================== */
let G = null; // geometría actual
function dims() {
  return isNarrow()
    ? { root: 190, fam: 190, est: 260, dec: 230, gapA: 36, gapB: 36, gapX: 150, vgap: 8, fgap: 16 }
    : { root: 230, fam: 230, est: 300, dec: 270, gapA: 50, gapB: 46, gapX: 230, vgap: 10, fgap: 22 };
}
function visible(id) {
  const n = NODES.get(id);
  if (n.type === "objetivo") return true;
  if (!state.open[ROOT.id]) return false;
  if (n.type === "familia" || n.type === "hub") return true;
  return !!state.open[n.parent];
}
function layout() {
  const D = dims();
  const x = {};
  x.root = 0; x.fam = D.root + D.gapA; x.est = x.fam + D.fam + D.gapB; x.dec = x.est + D.est + D.gapX;
  const pos = new Map();
  // anchuras y visibilidad
  for (const [id, n] of NODES) {
    const el = els.get(id);
    const w = n.type === "objetivo" ? D.root : n.type === "familia" ? D.fam : n.type === "estimador" ? D.est : D.dec;
    el.style.width = w + "px";
    el.style.display = visible(id) ? "flex" : "none";
    const tog = el.querySelector(".tog");
    if (tog) {
      const open = !!state.open[id];
      tog.textContent = open ? "−" : "+";
      tog.setAttribute("aria-label", (open ? "Plegar " : "Desplegar ") + n.label);
      tog.setAttribute("aria-expanded", open);
    }
  }
  const h = id => els.get(id).offsetHeight;

  // Columna de estimadores
  let y = 0;
  const famRows = [];
  if (state.open[ROOT.id]) {
    FAMILIAS.forEach(f => {
      if (state.open[f.id]) {
        const top = y, fh = h(f.id);
        const kids = f.children.reduce((a, c) => a + h(c) + D.vgap, -D.vgap);
        y += Math.max(0, (fh - kids) / 2); // si la familia es más alta que sus hijos, los centramos
        f.children.forEach(cid => { const hh = h(cid); pos.set(cid, { x: x.est, y, w: D.est, h: hh }); y += hh + D.vgap; });
        y = Math.max(y, top + fh + D.vgap);
        const bottom = y - D.vgap;
        pos.set(f.id, { x: x.fam, y: (top + bottom) / 2 - fh / 2, w: D.fam, h: fh });
        famRows.push([top, bottom]);
      } else {
        const fh = h(f.id);
        pos.set(f.id, { x: x.fam, y, w: D.fam, h: fh });
        y += fh + D.vgap;
      }
      y += D.fgap;
    });
    y -= D.fgap + D.vgap;
  }
  const spanTop = 0, spanBottom = Math.max(y, 0);
  const rh = h(ROOT.id);
  const rootY = state.open[ROOT.id] ? (spanTop + spanBottom) / 2 - rh / 2 : 0;
  pos.set(ROOT.id, { x: x.root, y: rootY, w: D.root, h: rh });

  // Columna de decisiones
  if (state.open[ROOT.id]) {
    const hubH = h(HUB.id);
    const decIds = DECISIONES.map(d => d.id);
    if (state.open[HUB.id]) {
      const hs = decIds.map(h);
      const need = hs.reduce((a, b) => a + b, 0) + D.vgap * 2 * (decIds.length - 1);
      const span = Math.max(need, spanBottom - spanTop);
      const slot = span / decIds.length;
      let start = (spanTop + spanBottom) / 2 - span / 2;
      decIds.forEach((id, i) => {
        const cy = start + slot * (i + 0.5);
        pos.set(id, { x: x.dec, y: cy - hs[i] / 2, w: D.dec, h: hs[i] });
      });
      const firstTop = pos.get(decIds[0]).y;
      pos.set(HUB.id, { x: x.dec, y: Math.min(spanTop, firstTop) - hubH - 60, w: D.dec, h: hubH });
    } else {
      pos.set(HUB.id, { x: x.dec, y: spanTop - hubH - 60, w: D.dec, h: hubH });
    }
  }

  // Normalizar a coordenadas positivas
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [id, p] of pos) { if (!visible(id)) continue; minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h); }
  const PAD = 40, spineX = x.dec + D.dec + 26;
  maxX = Math.max(maxX, spineX + 4);
  const ox = PAD - minX, oy = PAD - minY;
  for (const [id, p] of pos) { p.x += ox; p.y += oy; const el = els.get(id); el.style.left = p.x + "px"; el.style.top = p.y + "px"; }
  G = { pos, W: maxX - minX + PAD * 2, H: maxY - minY + PAD * 2, spineX: spineX + ox };
  drawEdges();
}

function pathH(x1, y1, x2, y2) {
  const dx = Math.max(30, (x2 - x1) / 2);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
}
function drawEdges() {
  const { pos, W, H, spineX } = G;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  stage.style.width = W + "px"; stage.style.height = H + "px";
  const frag = document.createDocumentFragment();
  const add = (d, cls, data) => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d); p.setAttribute("class", cls);
    if (data) for (const k in data) p.dataset[k] = data[k];
    frag.appendChild(p);
    return p;
  };
  const mid = p => p.y + p.h / 2;
  const r = pos.get(ROOT.id);
  if (state.open[ROOT.id]) {
    // objetivo → familias
    FAMILIAS.forEach(f => { const p = pos.get(f.id); add(pathH(r.x + r.w, mid(r), p.x, mid(p)), "tree"); });
    // familias → estimadores
    FAMILIAS.forEach(f => {
      if (!state.open[f.id]) return;
      const fp = pos.get(f.id);
      f.children.forEach(c => { const p = pos.get(c); add(pathH(fp.x + fp.w, mid(fp), p.x, mid(p)), "tree"); });
    });
    // objetivo → hub: sube por encima de las columnas
    const hb = pos.get(HUB.id), hy = mid(hb), rx = r.x + r.w / 2, rad = 18;
    add(`M${rx},${r.y} V${hy + rad} Q${rx},${hy} ${rx + rad},${hy} H${hb.x}`, "tree dec");
    // hub → decisiones por una espina a la derecha
    if (state.open[HUB.id]) {
      const last = pos.get(DECISIONES[DECISIONES.length - 1].id);
      add(`M${hb.x + hb.w},${hy} H${spineX - rad} Q${spineX},${hy} ${spineX},${hy + rad} V${mid(last)}`, "tree dec");
      DECISIONES.forEach(d => { const p = pos.get(d.id); add(`M${spineX},${mid(p)} H${p.x + p.w}`, "tree dec"); });
      // vínculos estimador → decisión
      FAMILIAS.forEach(f => {
        const fp = pos.get(f.id);
        if (state.open[f.id]) {
          f.children.forEach(cid => {
            const e = NODES.get(cid), p = pos.get(cid);
            e.links.forEach(([did]) => { const q = pos.get(did); add(pathH(p.x + p.w, mid(p), q.x, mid(q)), "xlink", { e: cid, d: did }); });
          });
        } else {
          const seen = new Set();
          f.children.forEach(cid => NODES.get(cid).links.forEach(([did]) => seen.add(did)));
          seen.forEach(did => { const q = pos.get(did); add(pathH(fp.x + fp.w, mid(fp), q.x, mid(q)), "xlink agg", { f: f.id, d: did, e: f.children.join(" ") }); });
        }
      });
    }
  }
  svg.replaceChildren(frag);
  applyFocus();
}

/* =====================================================================
   RESALTADO
   ===================================================================== */
function related(id) {
  const n = NODES.get(id), set = new Set([id]);
  if (!n) return set;
  if (n.type === "estimador") { n.links.forEach(([d]) => set.add(d)); set.add(n.fam); }
  else if (n.type === "decision") { n.back.forEach(([e]) => { set.add(e); set.add(NODES.get(e).fam); }); }
  else if (n.type === "familia") { n.children.forEach(c => { set.add(c); NODES.get(c).links.forEach(([d]) => set.add(d)); }); }
  else if (n.type === "hub") { DECISIONES.forEach(d => set.add(d.id)); }
  else { NODES.forEach((_, k) => set.add(k)); }
  return set;
}
function applyFocus() {
  const id = state.hover || state.sel;
  const focus = id && NODES.get(id).type !== "objetivo";
  document.body.classList.toggle("has-focus", !!focus);
  const rel = focus ? related(id) : null;
  els.forEach((el, k) => {
    el.classList.toggle("sel", k === state.sel);
    el.classList.toggle("rel", !!focus && k !== id && rel.has(k) && (NODES.get(k).type === "decision" || NODES.get(k).type === "estimador"));
    el.classList.toggle("dimmed", !!focus && !rel.has(k));
  });
  if (!focus) { svg.querySelectorAll(".xlink.hl").forEach(p => p.classList.remove("hl")); return; }
  const n = NODES.get(id);
  svg.querySelectorAll(".xlink").forEach(p => {
    let on = false;
    const es = (p.dataset.e || "").split(" ");
    if (n.type === "estimador") on = es.includes(id);
    else if (n.type === "decision") on = p.dataset.d === id;
    else if (n.type === "familia") on = p.dataset.f === id || NODES.get(id).children.includes(p.dataset.e);
    else if (n.type === "hub") on = true;
    p.classList.toggle("hl", on);
  });
}

/* =====================================================================
   PANEL
   ===================================================================== */
const KIND = { objetivo: "Objetivo", familia: "Familia de estimadores", estimador: "Estimador", hub: "Decisiones transversales", decision: "Decisión transversal" };
const LAB = { supuestos: "Supuestos", flexibilidad: "Flexibilidad", interpretabilidad: "Interpretabilidad", coste: "Coste" };
function matLinks(keys) {
  if (!keys || !keys.length) return "";
  return `<h3>Materiales</h3><p class="mat">` + keys.map(k => `<a href="${BASE + M[k][1]}" target="_blank" rel="noopener">${M[k][0]} ↗</a>`).join("") + `</p>`;
}
// Marca como código los identificadores de scikit-learn y deja el texto en castellano
const CODE_WORDS = new Set(["alpha", "C", "gini", "entropy", "estimator", "bootstrap", "strategy", "criterion"]);
function fmtCode(t) {
  if (t === "—" || t === "Keras") return t;
  return t.replace(/[A-Za-z_][\w.]*(\([^)]*\))?/g, w => (/[_(=]/.test(w) || /[a-z][A-Z]/.test(w) || CODE_WORDS.has(w)) ? `<code>${w}</code>` : w);
}
const chip = (id, cls = "") => `<button type="button" class="chip ${cls}" data-go="${id}">${NODES.get(id).label}</button>`;
function openPanel(id) {
  const n = NODES.get(id);
  let head = `<div class="p-kind ${n.type}">${KIND[n.type]}${n.type === "estimador" ? " · " + NODES.get(n.fam).label : ""}</div>
    <h2>${n.label}</h2><button type="button" class="p-close" id="pclose" aria-label="Cerrar panel">×</button><div class="badges">`;
  if (n.sesion) head += n.sesion.map(s => `<span class="badge">${s}</span>`).join("");
  else if (n.tema) head += `<span class="badge">${n.tema.replace(/^T/, "Tema ")}</span>`;
  if (n.pendiente) head += `<span class="badge warn">Ficha provisional: tema por publicar</span>`;
  head += `</div>`;
  let b = "";
  if (n.idea) b += `<p class="idea">${n.idea}</p>`;
  if (n.formula) b += `<div class="formula">${n.formula}</div>`;
  if (n.type === "estimador") {
    b += `<h3>Qué lo hace peculiar</h3><dl class="peculiar">` +
      Object.entries(n.peculiar).map(([k, v]) => `<dt>${LAB[k]}</dt><dd>${v}</dd>`).join("") + `</dl>`;
    b += `<h3>Hiperparámetros</h3><table class="hp"><thead><tr><th>Hiperparámetro</th><th>scikit-learn / librería</th><th>Efecto</th></tr></thead><tbody>` +
      n.hp.map(r => `<tr><td>${r[0]}</td><td>${fmtCode(r[1])}</td><td>${r[2]}</td></tr>`).join("") + `</tbody></table>`;
    b += `<h3>Decisiones vinculadas</h3><ul class="links">` +
      n.links.map(([d, why]) => `<li>${chip(d)}<span class="reason">${why}</span></li>`).join("") + `</ul>`;
  }
  if (n.puntos) b += `<h3>${n.type === "objetivo" ? "Ideas clave" : "Qué decidir y cómo"}</h3><ul>` + n.puntos.map(p => `<li>${p}</li>`).join("") + `</ul>`;
  if (n.type === "decision") {
    b += `<h3>Estimadores vinculados (${n.back.length})</h3><ul class="links">` +
      n.back.map(([e, why]) => `<li>${chip(e, "est")}<span class="reason">${why}</span></li>`).join("") + `</ul>`;
    if (n.id === "d_hiper") {
      b += `<h3>Hiperparámetros de cada estimador</h3><table class="hp"><thead><tr><th>Estimador</th><th>Hiperparámetros</th></tr></thead><tbody>` +
        ESTIMADORES.filter(e => e.hp[0][0] !== "—").map(e => `<tr><td>${chip(e.id, "est")}</td><td>${e.hp.map(r => r[0]).join(" · ")}</td></tr>`).join("") + `</tbody></table>`;
    }
  }
  if (n.type === "familia") b += `<h3>Estimadores</h3><p>` + n.children.map(c => chip(c, "est")).join("") + `</p>`;
  if (n.type === "hub") b += `<h3>Decisiones</h3><p>` + DECISIONES.map(d => chip(d.id)).join("") + `</p>`;
  if (n.type === "objetivo") b += `<h3>Ramas</h3><p>` + FAMILIAS.map(f => chip(f.id, "est")).join("") + chip(HUB.id) + `</p>`;
  b += matLinks(n.materiales);
  if (n.type === "estimador") {
    b += `<div class="simbox"><button type="button" disabled data-simulador="${n.id}" aria-label="Simular ${n.label} (no disponible todavía)">Simular</button>El simulador de este estimador se activará en una fase posterior.</div>`;
  }
  $("#phead").innerHTML = head;
  $("#pbody").innerHTML = b;
  $("#pbody").scrollTop = 0;
  $("#pclose").addEventListener("click", closePanel);
  document.body.classList.add("panel-open");
  renderMath($("#panel"));
}
function closePanel() {
  document.body.classList.remove("panel-open");
  select(null);
}
function renderMath(el) {
  if (window.renderMathInElement) {
    try {
      window.renderMathInElement(el, { delimiters: [{ left: "\\[", right: "\\]", display: true }, { left: "\\(", right: "\\)", display: false }], throwOnError: false });
    } catch (e) { /* sin KaTeX, se queda el texto */ }
  }
}
function setHash(id) {
  try { history.replaceState(null, "", id ? "#nodo=" + id : location.pathname + location.search); } catch (e) { /* iframe sandbox */ }
}
function select(id, opts = {}) {
  state.sel = id;
  if (id) {
    const n = NODES.get(id);
    // asegurar que el nodo es visible
    state.open[ROOT.id] = true;
    if (n.type === "estimador") state.open[n.fam] = true;
    if (n.type === "decision") state.open[HUB.id] = true;
    layout();
    openPanel(id);
    if (opts.center || !inView(id)) centerOn(id);
  } else {
    applyFocus();
  }
  setHash(id);
}

/* =====================================================================
   VISTA: desplazar y acercar
   ===================================================================== */
function applyView() {
  const v = state.view;
  stage.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`;
}
function visibleArea() {
  const r = viewport.getBoundingClientRect();
  let w = r.width, h = r.height;
  if (document.body.classList.contains("panel-open")) {
    if (isNarrow()) h -= window.innerHeight * 0.64; else w -= $("#panel").offsetWidth;
  }
  return { w: Math.max(w, 120), h: Math.max(h, 120) };
}
function fit(opts = {}) {
  const { w } = visibleArea();
  const h = visibleArea().h - ($(".legend").offsetHeight || 0) - 16;
  let k = Math.min(w / G.W, h / G.H, 1.1);
  if (opts.readable && isNarrow() && k < 0.5) {
    // En móvil, el mapa completo es ilegible: empezamos a escala legible mostrando objetivo, familias y estimadores
    k = 0.5;
    const r = G.pos.get(ROOT.id);
    state.view = { k, x: 4 - 20 * k, y: h / 2 - (r.y + r.h / 2) * k };
  } else {
    state.view = { k, x: (w - G.W * k) / 2, y: Math.max(8, (h - G.H * k) / 2) };
  }
  applyView();
}
function zoomAt(f, cx, cy) {
  const v = state.view, k = Math.min(2.5, Math.max(0.15, v.k * f));
  v.x = cx - (cx - v.x) * (k / v.k); v.y = cy - (cy - v.y) * (k / v.k); v.k = k;
  applyView();
}
function inView(id) {
  const p = G.pos.get(id); if (!p) return false;
  const { w, h } = visibleArea(), v = state.view;
  const x1 = p.x * v.k + v.x, y1 = p.y * v.k + v.y, x2 = (p.x + p.w) * v.k + v.x, y2 = (p.y + p.h) * v.k + v.y;
  return x1 >= 0 && y1 >= 0 && x2 <= w && y2 <= h;
}
function centerOn(id) {
  const p = G.pos.get(id); if (!p) return;
  const { w, h } = visibleArea();
  const v = state.view;
  if (v.k < 0.55) v.k = isNarrow() ? 0.8 : 0.75;
  v.x = w / 2 - (p.x + p.w / 2) * v.k;
  v.y = h / 2 - (p.y + p.h / 2) * v.k;
  applyView();
}

// Arrastre y pellizco
const pointers = new Map();
let drag = null, moved = false, pinch = null;
viewport.addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y }; moved = false; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: state.view.k };
  }
});
viewport.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = viewport.getBoundingClientRect();
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
    zoomAt((pinch.k * d / pinch.d) / state.view.k, cx, cy);
    moved = true; return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; viewport.classList.add("dragging"); try { viewport.setPointerCapture(e.pointerId); } catch (_) {} }
    if (moved) { state.view.x = drag.vx + dx; state.view.y = drag.vy + dy; applyView(); }
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { drag = null; viewport.classList.remove("dragging"); }
  else if (pointers.size === 1) { const [p] = [...pointers.values()]; drag = { x: p.x, y: p.y, vx: state.view.x, vy: state.view.y }; }
}
viewport.addEventListener("pointerup", endPointer);
viewport.addEventListener("pointercancel", endPointer);
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { state.view.x -= e.deltaX; state.view.y -= e.deltaY; applyView(); }
}, { passive: false });

// Clics en el mapa
viewport.addEventListener("click", e => {
  if (moved) { moved = false; return; }
  const tog = e.target.closest(".tog");
  if (tog) { toggle(tog.dataset.tog); return; }
  if (e.target.closest(".sim")) return;
  const node = e.target.closest(".node");
  if (node) { const id = node.dataset.id; if (state.sel === id) closePanel(); else select(id); return; }
  if (state.sel) closePanel();
});
viewport.addEventListener("dblclick", e => {
  const node = e.target.closest(".node.familia, .node.hub, .node.objetivo");
  if (node) toggle(node.dataset.id);
});
viewport.addEventListener("keydown", e => {
  const node = e.target.closest(".node");
  if (!node) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(node.dataset.id); }
  if ((e.key === "+" || e.key === "-") && state.open[node.dataset.id] !== undefined) toggle(node.dataset.id);
});
stage.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const node = e.target.closest(".node.estimador, .node.decision, .node.familia");
  const id = node ? node.dataset.id : null;
  if (id !== state.hover) { state.hover = id; applyFocus(); }
});
stage.addEventListener("pointerleave", () => { if (state.hover) { state.hover = null; applyFocus(); } });

function toggle(id) {
  state.open[id] = !state.open[id];
  const before = G.pos.get(id), bx = before.x, by = before.y;
  layout();
  // mantener el nodo plegado/desplegado en el mismo sitio de la pantalla
  const after = G.pos.get(id);
  state.view.x += (bx - after.x) * state.view.k;
  state.view.y += (by - after.y) * state.view.k;
  applyView();
}

/* =====================================================================
   PANEL: navegación entre nodos
   ===================================================================== */
$("#panel").addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) select(go.dataset.go, { center: true });
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#results").classList.contains("show")) hideResults(); else if (state.sel) closePanel(); }
});

/* =====================================================================
   BUSCADOR
   ===================================================================== */
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const strip = s => (s || "").replace(/<[^>]+>/g, " ").replace(/\\[a-zA-Z]+/g, " ");
const INDEX = [];
NODES.forEach(n => {
  const parts = [n.label, n.sub, n.idea, n.formula, ...(n.puntos || []), ...(n.sesion || [])];
  if (n.peculiar) parts.push(...Object.values(n.peculiar));
  if (n.hp) n.hp.forEach(r => parts.push(...r));
  if (n.links) n.links.forEach(l => parts.push(l[1]));
  INDEX.push({ id: n.id, label: norm(n.label), text: norm(strip(parts.join(" "))) });
});
const qEl = $("#q"), resEl = $("#results");
let active = -1, current = [];
function search(q) {
  const t = norm(q.trim());
  state.query = t;
  if (t.length < 2) { document.body.classList.remove("searching"); els.forEach(el => el.classList.remove("match")); hideResults(); return; }
  const words = t.split(/\s+/);
  current = INDEX.map(it => {
    let score = 0;
    for (const w of words) {
      if (it.label.includes(w)) score += it.label.startsWith(w) ? 4 : 3;
      else if (it.text.includes(w)) score += 1;
      else return null;
    }
    return { id: it.id, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  const ids = new Set(current.map(r => r.id));
  // una familia plegada se marca si contiene coincidencias
  FAMILIAS.forEach(f => { if (!state.open[f.id] && f.children.some(c => ids.has(c))) ids.add(f.id); });
  if (!state.open[HUB.id] && DECISIONES.some(d => ids.has(d.id))) ids.add(HUB.id);
  document.body.classList.add("searching");
  els.forEach((el, k) => el.classList.toggle("match", ids.has(k)));
  active = current.length ? 0 : -1;
  showResults();
}
function showResults() {
  resEl.innerHTML = current.length
    ? current.slice(0, 10).map((r, i) => { const n = NODES.get(r.id); return `<li role="option"><button type="button" data-go="${r.id}" class="${i === active ? "active" : ""}"><span>${n.label}</span><span class="kind">${KIND[n.type]}</span></button></li>`; }).join("")
    : `<li class="empty">Sin resultados</li>`;
  resEl.classList.add("show");
}
function hideResults() { resEl.classList.remove("show"); }
qEl.addEventListener("input", () => search(qEl.value));
qEl.addEventListener("focus", () => { if (state.query.length >= 2) showResults(); });
qEl.addEventListener("keydown", e => {
  if (!current.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, Math.min(current.length, 10) - 1); showResults(); }
  if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); showResults(); }
  if (e.key === "Enter" && active >= 0) { e.preventDefault(); goResult(current[active].id); }
});
resEl.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) goResult(b.dataset.go); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) hideResults(); });
function goResult(id) {
  hideResults(); qEl.blur();
  qEl.value = ""; search("");
  if (document.body.classList.contains("list-mode")) toggleList(false);
  select(id, { center: true });
}

/* =====================================================================
   VISTA EN LISTA
   ===================================================================== */
function buildOutline() {
  const w = $("#outline .wrap");
  let h = `<button type="button" class="rootbtn" data-go="${ROOT.id}">${ROOT.label}<small>${ROOT.sub}</small></button>`;
  FAMILIAS.forEach(f => {
    h += `<details class="familia" open><summary>${f.label}</summary><ul>` +
      f.children.map(c => { const e = NODES.get(c); return `<li><button type="button" data-go="${c}"><span>${e.label}</span><small>${e.tema}${e.pendiente ? " · por publicar" : ""}</small></button></li>`; }).join("") +
      `</ul></details>`;
  });
  h += `<details class="hub" open><summary>${HUB.label}</summary><ul>` +
    DECISIONES.map(d => `<li><button type="button" data-go="${d.id}"><span>${d.label}</span><small>${d.back.length} estimadores</small></button></li>`).join("") + `</ul></details>`;
  w.innerHTML = h;
}
buildOutline();
$("#outline").addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  const n = NODES.get(b.dataset.go);
  state.sel = n.id; openPanel(n.id); setHash(n.id);
});
function toggleList(force) {
  const on = force !== undefined ? force : !document.body.classList.contains("list-mode");
  document.body.classList.toggle("list-mode", on);
  $("#listBtn").setAttribute("aria-pressed", on);
  $("#listBtn").textContent = on ? "Mapa" : "Lista";
  if (!on) { layout(); if (state.sel) centerOn(state.sel); else fit(); }
}
$("#listBtn").addEventListener("click", () => toggleList());

/* =====================================================================
   BOTONES
   ===================================================================== */
$("#zin").addEventListener("click", () => { const { w, h } = visibleArea(); zoomAt(1.25, w / 2, h / 2); });
$("#zout").addEventListener("click", () => { const { w, h } = visibleArea(); zoomAt(0.8, w / 2, h / 2); });
$("#zfit").addEventListener("click", fit);
$("#expandAll").addEventListener("click", () => { Object.keys(state.open).forEach(k => state.open[k] = true); layout(); fit(); });
$("#collapseAll").addEventListener("click", () => { FAMILIAS.forEach(f => state.open[f.id] = false); layout(); fit(); });

let rT = null;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { layout(); fit(); }, 120); });

/* =====================================================================
   INICIO
   ===================================================================== */
layout();
fit({ readable: true });
(function fromHash() {
  const m = /nodo=([\w-]+)/.exec(location.hash);
  if (m && NODES.has(m[1])) select(m[1], { center: true });
})();
// KaTeX se carga con defer: si el panel ya estaba abierto, se renderiza al llegar
window.addEventListener("load", () => { if (document.body.classList.contains("panel-open")) renderMath($("#panel")); });
</script>
</body>
